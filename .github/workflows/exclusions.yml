name: Exclusions Updater

# The Python false-positive sweep that maintained the upstream exclusions
# branch is not part of the default test run. Live checks are opt-in:
#   go test -tags online ./...
on:
  workflow_dispatch:

jobs:
  online:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Optional live checks
        run: go test -tags online ./internal/search/
