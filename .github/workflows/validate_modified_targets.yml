name: Validate manifest

on:
  pull_request:
    paths:
      - "resources/data.json"
      - "resources/data.schema.json"
      - "internal/sites/**"
      - ".github/workflows/validate_modified_targets.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Schema and site-list tests
        run: go test ./internal/sites/ ./internal/search/ ./internal/cli/
